<!DOCTYPE html>
// just taken from another repo by me
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Annoying Popup</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #1e2a3a;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            text-align: center;
            color: white;
        }

        .container h1 {
            font-size: 3rem;
            margin-bottom: 10px;
        }

        .container p {
            opacity: 0.7;
            font-size: 1.1rem;
        }

        .counter {
            margin-top: 20px;
            font-size: 1.5rem;
            color: #ca9e6e;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🔔 Annoying Popup</h1>
        <p>This will keep popping up forever...</p>
        <div class="counter" id="counter">Popup #0</div>
    </div>

    <script>
        let popupCount = 0;

        async function getRandomFact() {
            try {
                const response = await fetch('https://uselessfacts.jsph.pl/random.json?language=en');
                const data = await response.json();
                return data.text;
            } catch (error) {
                return 'Did you know? You can\'t escape this popup! 😈';
            }
        }

        async function showAnnoyingPopup() {
            popupCount++;
            document.getElementById('counter').textContent = `Popup #${popupCount}`;

            const fact = await getRandomFact();

            alert(`📢 RANDOM FACT #${popupCount}\n\n${fact}`);
        }

        function startAnnoyingLoop() {
            setTimeout(async function() {
                await showAnnoyingPopup();
                
                setInterval(async function() {
                    await showAnnoyingPopup();
                }, 1);
            }, 1);
        }

        window.addEventListener('load', startAnnoyingLoop);
    </script>

</body>
</html>
